<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Crew Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .top-bar {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
      padding: 10px;
      background: #f3f3f3;
      border-radius: 6px;
    }

    .controls {
      margin-bottom: 15px;
    }

    select, input {
      padding: 6px;
      margin-right: 10px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
    }

    th {
      background: #eee;
    }

    #chartsContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
    }

    .chartBox {
      width: 220px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="top-bar" id="totalCost">
  Total Crew Cost: 0
</div>

<h2>Ship Capacity</h2>
<div id="chartsContainer"></div>

<div class="controls">
  <select id="shipFilter">
    <option value="">All Ships</option>
  </select>

  <select id="typeFilter">
    <option value="">All Types</option>
    <option value="Player">Player</option>
    <option value="NPC">NPC</option>
  </select>

  <select id="statusFilter">
    <option value="">All Status</option>
    <option value="Alive">Alive</option>
    <option value="Dead">Dead</option>
  </select>
</div>

<div id="tableContainer"></div>

<script>
(async function () {

  const res = await fetch('./crew.json');
  const crew = await res.json();

  const tableContainer = document.getElementById("tableContainer");
  const chartsContainer = document.getElementById("chartsContainer");

  const shipFilter = document.getElementById("shipFilter");
  const typeFilter = document.getElementById("typeFilter");
  const statusFilter = document.getElementById("statusFilter");


  const ships = [...new Set(crew.map(c => c.ship))];
  ships.forEach(ship => {
    const opt = document.createElement("option");
    opt.value = ship;
    opt.textContent = ship;
    shipFilter.appendChild(opt);
  });


  function renderShipCharts() {
    chartsContainer.innerHTML = "";

    const shipCounts = {};
    crew.forEach(c => {
      shipCounts[c.ship] = (shipCounts[c.ship] || 0) + 1;
    });

    const capacityLimits = {
      "Nyra": 9,
      "Orzel": 9,
      "Nocturn in C": 30
    };

    Object.keys(shipCounts).forEach((ship, i) => {

      const used = shipCounts[ship];
      const max = capacityLimits[ship] || 10;
      const free = Math.max(max - used, 0);

      const canvasId = `chart_${i}`;

      const box = document.createElement("div");
      box.className = "chartBox";

      box.innerHTML = `
        <h3>${ship}</h3>
        <canvas id="${canvasId}" width="200" height="200"></canvas>
        <div>${used} / ${max}</div>
      `;

      chartsContainer.appendChild(box);

      new Chart(document.getElementById(canvasId), {
        type: "pie",
        data: {
          labels: ["Used", "Free"],
          datasets: [{
            data: [used, free]
          }]
        },
        options: {
          responsive: false
        }
      });
    });
  }


  function render() {

    const shipVal = shipFilter.value;
    const typeVal = typeFilter.value;
    const statusVal = statusFilter.value;

    let filtered = crew.filter(c =>
      (!shipVal || c.ship === shipVal) &&
      (!typeVal || c.type === typeVal) &&
      (!statusVal || c.status === statusVal)
    );

    let totalCost = 0;
    crew.forEach(c => {
      if (c.status === "Alive") totalCost += c.cost;
    });

    let html = `
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Cost</th>
            <th>Ship</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
    `;

    filtered.forEach(c => {
      html += `
        <tr>
          <td>${c.name}</td>
          <td>${c.type}</td>
          <td>${c.cost}</td>
          <td>${c.ship}</td>
          <td>${c.status}</td>
        </tr>
      `;
    });

    html += "</tbody></table>";

    tableContainer.innerHTML = html;

    document.getElementById("totalCost").textContent =
      "Total Crew Cost: " + totalCost.toFixed(2) + " GP/Day";

    renderShipCharts();
  }


  shipFilter.addEventListener("change", render);
  typeFilter.addEventListener("change", render);
  statusFilter.addEventListener("change", render);

  render();

})();
</script>

</body>
</html>
