<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Crew Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .top-bar {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
      padding: 10px;
      background: #f3f3f3;
      border-radius: 6px;
    }

    .controls {
      margin-bottom: 15px;
    }

    select, input {
      padding: 6px;
      margin-right: 10px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
    }

    th {
      background: #eee;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="top-bar" id="totalCost">
  Total Crew Cost: 0
</div>

<div class="controls">
  <select id="shipFilter">
    <option value="">All Ships</option>
  </select>

  <select id="typeFilter">
    <option value="">All Types</option>
    <option value="Player">Player</option>
    <option value="NPC">NPC</option>
  </select>

  <select id="statusFilter">
    <option value="">All Status</option>
    <option value="Alive">Alive</option>
    <option value="Dead">Dead</option>
  </select>
</div>

<div id="tableContainer"></div>

<script>
(async function () {

  const res = await fetch('./crew.json');
  const crew = await res.json();

  const container = document.getElementById("tableContainer");

  const shipFilter = document.getElementById("shipFilter");
  const typeFilter = document.getElementById("typeFilter");
  const statusFilter = document.getElementById("statusFilter");


  const ships = [...new Set(crew.map(c => c.ship))];
  ships.forEach(ship => {
    let opt = document.createElement("option");
    opt.value = ship;
    opt.textContent = ship;
    shipFilter.appendChild(opt);
  });

  function renderShipCapacity() {
  const container = document.getElementById("shipCapacityContainer");

  const ships = {};

  // calculate used capacity (count crew per ship)
  crew.forEach(c => {
    if (!ships[c.ship]) {
      ships[c.ship] = { used: 0, total: 0 };
    }
    ships[c.ship].used += 1;
  });

  // define max capacity (you can edit this)
  const capacityLimits = {
    "Nyra": 9,
    "Orzel": 9,
    "Nocturn in C": 30
  };

  let html = "";

  Object.keys(ships).forEach(ship => {
    const used = ships[ship].used;
    const max = capacityLimits[ship] || 10;
    const percent = Math.min(used / max, 1);

    const bars = Math.round(percent * 20);
    const barDisplay =
      "█".repeat(bars) + "░".repeat(20 - bars);

    html += `
      <div style="margin-bottom:10px;">
        <strong>${ship}</strong><br>
        <code>${barDisplay}</code> ${used} / ${max}
      </div>
    `;
  });

  container.innerHTML = html;
}

  function render() {
    const shipVal = shipFilter.value;
    const typeVal = typeFilter.value;
    const statusVal = statusFilter.value;

    let totalCost = 0;

    let filtered = crew.filter(c =>
      (!shipVal || c.ship === shipVal) &&
      (!typeVal || c.type === typeVal) &&
      (!statusVal || c.status === statusVal)
    );


    crew.forEach(c => {
      if (c.status === "Alive") {
        totalCost += c.cost;
      }
    });

    let html = `
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Cost</th>
            <th>Ship</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
    `;

    filtered.forEach(c => {
      html += `
        <tr>
          <td>${c.name}</td>
          <td>${c.type}</td>
          <td>${c.cost}</td>
          <td>${c.ship}</td>
          <td>${c.status}</td>
        </tr>
      `;
    });

    html += "</tbody></table>";

    container.innerHTML = html;

    document.getElementById("totalCost").textContent =
      "Total Crew Cost: " + totalCost.toFixed(2);

    renderShipCapacity();
  }

  shipFilter.addEventListener("change", render);
  typeFilter.addEventListener("change", render);
  statusFilter.addEventListener("change", render);

  render();

})();
</script>

</body>
</html>
