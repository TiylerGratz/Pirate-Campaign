<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pantheon Family Tree</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/treant-js@1.0/Treant.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/treant-js@1.0/Treant.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fafafa;
      padding: 20px;
      margin: 0;
    }

    #tree {
      width: 100%;
      height: 1600px;
      overflow: auto;
    }

    .Treant .node {
      border: 1px solid #d8d8d8;
      border-radius: 10px;
      padding: 10px 14px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
      min-width: 120px;
    }

    .Treant .node a {
      text-decoration: none;
      color: #222;
      font-weight: bold;
    }

    .couple {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .partner {
      border: 1px solid #d8d8d8;
      border-radius: 10px;
      padding: 10px 14px;
      background: white;
      min-width: 120px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
  </style>
</head>

<body>

<div id="tree"></div>

<script>

function single(name, link) {
  return {
    HTMLclass: "node",
    innerHTML: `
      <a href="${link}">${name}</a>
    `
  };
}

function couple(name1, link1, name2, link2) {
  return {
    HTMLclass: "node",
    innerHTML: `
      <div class="couple">
        <div class="partner">
          <a href="${link1}">${name1}</a>
        </div>

        <div class="partner">
          <a href="${link2}">${name2}</a>
        </div>
      </div>
    `
  };
}

const tree = {
  chart: {
    container: "#tree",
    rootOrientation: "NORTH",
    levelSeparation: 60,
    siblingSeparation: 40,
    subTeeSeparation: 40,
    connectors: {
      type: "step"
    },
    nodeAlign: "BOTTOM"
  },

  nodeStructure: {
    ...couple(
      "Aionis",
      "/Pirate-Campaign/Pantheon/Gods/Aionis",
      "Liora",
      "/Pirate-Campaign/Pantheon/Gods/Liora"
    ),

    children: [

      {
        ...single(
          "Nyraxis",
          "/Pirate-Campaign/Pantheon/Gods/Nyraxis"
        ),

        children: [
          single("Nerion", "/Pirate-Campaign/Pantheon/Gods/Nerion"),
          single("Pelarys", "/Pirate-Campaign/Pantheon/Gods/Pelarys")
        ]
      },

      {
        ...single(
          "Thamior",
          "/Pirate-Campaign/Pantheon/Gods/Thamior"
        ),

        children: [
          single("Marvos", "/Pirate-Campaign/Pantheon/Gods/Marvos"),
          single("Minara", "/Pirate-Campaign/Pantheon/Gods/Minara")
        ]
      },

      {
        ...couple(
          "Izelon",
          "/Pirate-Campaign/Pantheon/Gods/Izelon",
          "Fenrix",
          "/Pirate-Campaign/Pantheon/Gods/Fenrix"
        ),

        children: [
          single("Myrelon", "/Pirate-Campaign/Pantheon/Gods/Myrelon"),
          single("Soryn", "/Pirate-Campaign/Pantheon/Gods/Soryn"),
          single("Morvex", "/Pirate-Campaign/Pantheon/Gods/Morvex")
        ]
      },

      {
        ...couple(
          "Eryx",
          "/Pirate-Campaign/Pantheon/Gods/Eryx",
          "Thesara",
          "/Pirate-Campaign/Pantheon/Gods/Thesara"
        ),

        children: [
          {
            ...single(
              "Eshara",
              "/Pirate-Campaign/Pantheon/Gods/Eshara"
            ),

            children: [
              single("Aureth", "/Pirate-Campaign/Pantheon/Gods/Aureth"),
              single("Ceryn", "/Pirate-Campaign/Pantheon/Gods/Ceryn"),
              single("Phaelon", "/Pirate-Campaign/Pantheon/Gods/Phaelon")
            ]
          }
        ]
      }

    ]
  }
};

new Treant(tree);

</script>

</body>
</html>
